<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} · SalesLens</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0b1120;--card:#131c31;--line:#1f2a44;--ink:#e8ecf4;--mut:#9aa6bd;--g:#6ee7b7;--b:#60a5fa;--r:#f87171;--y:#fbbf24}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#1e2d5a55,transparent),var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:220px;padding:24px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:20px;margin:0 10px 24px;background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;color:transparent}
nav a{display:block;padding:10px 14px;margin:2px 0;border-radius:10px;color:var(--mut);text-decoration:none}
nav a:hover{background:var(--card);color:var(--ink)}nav a.on{background:linear-gradient(90deg,#60a5fa30,#6ee7b720);color:var(--ink)}
main{flex:1;padding:28px 34px;min-width:0}h2{margin:0 0 4px;font-size:26px}.muted{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:2fr 1fr}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;margin-top:4px}.up{color:var(--g)}.dn{color:var(--r)}
.h{height:300px;position:relative}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#6ee7b722;color:var(--g)}.warn{background:#fbbf2422;color:var(--y)}.bad{background:#f8717122;color:var(--r)}.neutral{background:#9aa6bd22;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}pre{background:#0b1120;padding:12px;border-radius:10px;overflow:auto;font-size:13px}
textarea{width:100%;height:150px;background:#0b1120;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px monospace}
button{background:linear-gradient(90deg,var(--b),var(--g));border:0;color:#04101f;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer;margin:6px 6px 0 0}
button.alt{background:var(--line);color:var(--ink)}.tip{border-left:3px solid var(--b)}.scroll{overflow-x:auto}
@media(max-width:800px){body{display:block}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}nav h1{width:100%}main{padding:18px}.two{grid-template-columns:1fr}}
</style></head><body>
<nav><h1>◆ SalesLens</h1>{% for p,n in [('/','Dashboard'),('/products','Products'),('/regions','Regions'),('/cleaning','Data Cleaning'),('/ai','AI Insights'),('/sql','SQL Lab')] %}<a href="{{p}}" class="{{'on' if request.path==p}}">{{n}}</a>{% endfor %}</nav>
<main>{% block body %}{% endblock %}</main>
<script>
const fmt=n=>{if(n==null)return'–';const a=Math.abs(n),s=n<0?'-':'';return s+(a>=1e7?'₹'+(a/1e7).toFixed(2)+' Cr':a>=1e5?'₹'+(a/1e5).toFixed(2)+' L':'₹'+Math.round(a).toLocaleString('en-IN'))};
const J=u=>fetch(u).then(r=>r.json()),PAL=['#6ee7b7','#60a5fa','#f472b6','#fbbf24','#a78bfa','#fb923c'];
Chart.defaults.color='#9aa6bd';Chart.defaults.borderColor='#1f2a44';
const chart=(id,type,labels,sets,o={})=>new Chart(document.getElementById(id),{type,data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,...o}});
const table=(id,rows,cols)=>document.getElementById(id).innerHTML='<thead><tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${c[2]?c[2](r[c[1]],r):r[c[1]]}</td>`).join('')+'</tr>').join('')+'</tbody>';
const mg=v=>`<span class="pill ${v<0?'bad':v<20?'warn':'ok'}">${v}%</span>`;
</script>{% block js %}{% endblock %}</body></html>
